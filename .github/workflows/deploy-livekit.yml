name: Deploy Production LiveKit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-livekit
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: deployments/deploy/deploy-livekit-production.sh
          target: /root/deploy/
          strip_components: 2

      - name: Deploy LiveKit on production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          script: |
            set -e
            SCRIPT=/root/deploy/deploy-livekit-production.sh
            chmod 700 "$SCRIPT"
            "$SCRIPT"

      - name: Verify public TLS and firewall
        shell: bash
        run: |
          set -euo pipefail

          curl --silent --show-error --output /dev/null \
            --connect-timeout 10 --retry 5 --retry-delay 2 \
            https://8.148.66.77/

          timeout 10 bash -c '</dev/tcp/8.148.66.77/7881'

          if timeout 3 bash -c '</dev/tcp/8.148.66.77/7880' 2>/dev/null; then
            echo 'LiveKit internal port 7880 is unexpectedly public' >&2
            exit 1
          fi

          echo | openssl s_client \
            -connect 8.148.66.77:443 \
            -verify_ip 8.148.66.77 \
            -verify_return_error 2>/dev/null \
            | openssl x509 -noout -dates -ext subjectAltName

          echo 'Public LiveKit TLS, ICE/TCP, and port isolation checks passed'

      - name: Finalize deployment after public validation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            /root/deploy/deploy-livekit-production.sh finalize

      - name: Roll back when deployment or validation fails
        if: ${{ failure() || cancelled() }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            /root/deploy/deploy-livekit-production.sh rollback
