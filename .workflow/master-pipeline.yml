version: '1.0'
name: deploy-free-im-chat
displayName: 部署 Free-IM-Chat

# dawn 2026-06-22 迁移 Gitee Go：仓库迁到 Gitee 后由目标服务器主机组直接构建并部署。
triggers:
  push:
    branches:
      include:
        - main

stages:
  - stage:
    name: build_and_deploy
    displayName: 构建并部署
    steps:
      - step: shell@agent
        name: deploy_chat
        displayName: Docker 构建部署 Free-IM-Chat
        hostGroupID: freechat-prod
        script: |
          set -euo pipefail

          IMAGE_NAME=freechat-chat
          CONTAINER_NAME=freechat-chat

          docker build -t "${IMAGE_NAME}:latest" .

          docker stop "${CONTAINER_NAME}" 2>/dev/null || true
          docker rm "${CONTAINER_NAME}" 2>/dev/null || true

          mkdir -p /data/app/chat/config /data/logs/chat

          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            --network host \
            -v /data/app/chat/config:/im-chat/config \
            -v /data/logs/chat:/im-chat/_output/logs \
            "${IMAGE_NAME}:latest"

          docker ps --filter "name=${CONTAINER_NAME}"
